[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "devjob-agent"
version = "0.1.0"
description = "Assistente de carreira local e open source: perfil profissional, busca de vagas, biblioteca de currículos e candidaturas preparadas. Skill para Claude Code e Cursor."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.11"
authors = [{ name = "DevJob Agent contributors" }]
keywords = ["jobs", "resume", "career", "claude-code", "cursor", "skill", "ats"]
classifiers = [
  "Programming Language :: Python :: 3",
  "Operating System :: OS Independent",
  "Environment :: Console",
]
dependencies = [
  "pypdf>=4.0",
  "python-docx>=1.1",
  "PyYAML>=6.0",
  "fpdf2>=2.7",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
devjob = "devjob.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
devjob = ["storage/migrations/*.sql", "templates/*.md", "templates/*.yaml"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
